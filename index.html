<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Penyo Debut Countdown</title>
  
  <style>
    /* 사용자 커스텀 폰트 적용 (font.ttf) */
    @font-face {
      font-family: 'CustomFont';
      src: url('font.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden; /* 스크롤 차단 */
      font-family: 'CustomFont', sans-serif;
    }

    /* 동적 패럴랙스 배경 트랙 (위 ➔ 아래 스크롤 애니메이션) */
    .bg-parallax-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: url('Bg.png');
      background-size: cover;
      background-position: top center;
      background-repeat: no-repeat;
      background-color: #fff5f8;
      transition: background-position 0.9s cubic-bezier(0.65, 0, 0.35, 1);
      z-index: 0;
    }

    .bg-parallax-layer.bottom-view {
      background-position: bottom center;
    }

    /* 전체 수직 슬라이딩 트랙 컨테이너 */
    .slider-track {
      width: 100vw;
      height: 200vh;
      position: absolute;
      top: 0;
      left: 0;
      transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1);
      transform: translateY(0%);
      z-index: 1;
    }

    /* 각 섹션 뷰 (100vh) */
    .section-view {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* =========================================
       우측 상단 핫키 버튼 그룹 (모바일 반응형 대응)
       ========================================= */
    .hotkey-group {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 110;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .hotkey-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 8px 20px rgba(219, 39, 119, 0.2);
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s;
    }

    .hotkey-btn:hover {
      transform: scale(1.12);
      background: rgba(255, 255, 255, 0.95);
    }

    .hotkey-btn svg {
      width: 18px;
      height: 18px;
      fill: #be185d;
    }

    .naver-cafe-icon {
      font-family: sans-serif;
      font-weight: 900;
      font-size: 1.15rem;
      color: #03c75a;
    }

    .youtube-icon-svg {
      fill: #ff0000 !important;
    }

    /* =========================================
       PAGE 1: 카운트다운 메인 뷰 (모바일 반응형 대응)
       ========================================= */
    .target-title {
      font-family: 'CustomFont', sans-serif;
      font-size: clamp(1.3rem, 4.5vw, 2.8rem);
      font-weight: normal;
      color: #ffffff;
      text-shadow: 
        0 0 15px rgba(255, 255, 255, 1),
        0 0 30px rgba(255, 182, 193, 1),
        0 0 50px rgba(219, 39, 119, 0.95),
        0 0 80px rgba(147, 51, 234, 0.8),
        0 4px 10px rgba(0, 0, 0, 0.6);
      margin-bottom: 0;
      padding-bottom: 2.2rem;
      text-align: center;
      letter-spacing: 3px;
      padding-left: 0.5rem;
      padding-right: 0.5rem;
    }

    .timer-display {
      font-family: 'CustomFont', sans-serif;
      font-size: clamp(3.2rem, 14vw, 12.5rem);
      font-weight: bold;
      color: #ffffff;
      text-shadow: 
        0 0 30px rgba(255, 182, 193, 1),
        0 0 60px rgba(219, 39, 119, 0.95),
        0 0 100px rgba(147, 51, 234, 0.8),
        0 8px 20px rgba(0, 0, 0, 0.5);
      line-height: 1;
      text-align: center;
      letter-spacing: clamp(4px, 2vw, 12px);
      margin-bottom: 1.5rem;
      padding: 0 0.5rem;
    }

    .day-sub-display {
      font-family: 'CustomFont', sans-serif;
      font-size: clamp(1.25rem, 4vw, 2.4rem);
      color: #ffffff;
      text-shadow: 
        0 0 15px rgba(255, 255, 255, 1),
        0 0 30px rgba(255, 182, 193, 1),
        0 0 50px rgba(219, 39, 119, 0.95),
        0 0 80px rgba(147, 51, 234, 0.8),
        0 4px 10px rgba(0, 0, 0, 0.6);
      text-align: center;
      letter-spacing: 4px;
    }

    .page1-bottom-bar {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      padding: 0.4rem 1.4rem;
      border-radius: 25px;
      box-shadow: 0 8px 20px rgba(219, 39, 119, 0.18);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .page1-bottom-bar:hover {
      transform: translateX(-50%) scale(1.08);
      background: rgba(255, 255, 255, 0.7);
      box-shadow: 0 12px 25px rgba(219, 39, 119, 0.3);
    }

    .page1-bottom-bar-text {
      font-family: 'CustomFont', sans-serif;
      font-size: clamp(0.95rem, 2.2vw, 1.25rem);
      font-weight: bold;
      color: #be185d;
      letter-spacing: 1px;
    }

    .page1-bottom-bar-icon {
      font-size: 0.9rem;
      color: #db2777;
    }

    /* =========================================
       PAGE 2: 회전목마(3D Carousel) 뷰 (모바일 완벽 대응)
       ========================================= */
    .x-section-wrapper {
      width: 100%;
      max-width: 1550px;
      height: 88vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.5rem 0.5rem 0 0.5rem;
    }

    .x-section-title {
      font-family: 'CustomFont', sans-serif;
      font-size: clamp(1.2rem, 3.5vw, 2rem);
      color: #ffffff;
      text-shadow: 0 0 15px rgba(255, 105, 180, 0.8);
      margin-bottom: 0.6rem;
      text-align: center;
    }

    .box-outer-container {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      position: relative;
      padding: 0 3.5rem;
    }

    .nav-arrow-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 30;
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 1)) drop-shadow(0 0 25px rgba(244, 114, 182, 0.9));
      transition: all 0.3s ease;
      padding: 0.3rem;
    }

    .nav-arrow-btn.left { left: 0.2rem; }
    .nav-arrow-btn.right { right: 0.2rem; }

    .nav-arrow-btn svg {
      width: clamp(44px, 8vw, 68px);
      height: clamp(44px, 8vw, 68px);
      fill: #ffffff;
    }

    .nav-arrow-btn:hover {
      transform: translateY(-50%) scale(1.15);
      filter: drop-shadow(0 0 20px rgba(255, 255, 255, 1)) drop-shadow(0 0 35px rgba(236, 72, 153, 1));
    }

    .pink-container-box {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.35) 0%, rgba(255, 192, 203, 0.2) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 32px;
      padding: 1rem 0.5rem;
      box-shadow: 
        0 30px 60px rgba(219, 39, 119, 0.18),
        inset 0 1px 2px rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .carousel-track {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
    }

    .carousel-card-item {
      position: absolute;
      width: min(380px, 86vw) !important;
      min-width: min(380px, 86vw) !important;
      max-width: 380px !important;
      height: min(670px, 82vh) !important;
      border-radius: 24px;
      
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 240, 245, 0.3) 100%);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1.8px solid rgba(255, 255, 255, 0.9);
      box-shadow: 
        0 20px 45px rgba(219, 39, 119, 0.15),
        inset 0 1.5px 3px rgba(255, 255, 255, 1);
      
      padding: 0.6rem 0.6rem;
      
      overflow-y: auto;
      overflow-x: hidden;

      -webkit-font-smoothing: antialiased;
      backface-visibility: hidden;
      transform-style: preserve-3d;
      will-change: transform, opacity;
      
      transition: 
        transform 0.6s cubic-bezier(0.25, 1, 0.5, 1),
        opacity 0.6s ease,
        filter 0.6s ease,
        z-index 0.6s,
        background 0.4s ease;
    }

    .carousel-card-item iframe,
    .carousel-card-item .twitter-tweet,
    .carousel-card-item .twitter-tweet-rendered {
      width: 100% !important;
      min-width: 100% !important;
      max-width: 100% !important;
      margin: 0 !important;
      transition: mask-image 0.3s ease, -webkit-mask-image 0.3s ease;
    }

    /* 3-State 동적 스크롤 페이드 마스크 */
    .carousel-card-item.scrolled-top iframe,
    .carousel-card-item.scrolled-top .twitter-tweet,
    .carousel-card-item.scrolled-top .twitter-tweet-rendered {
      -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 1) 78%, rgba(0, 0, 0, 0) 100%);
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 1) 78%, rgba(0, 0, 0, 0) 100%);
    }

    .carousel-card-item.scrolled-middle iframe,
    .carousel-card-item.scrolled-middle .twitter-tweet,
    .carousel-card-item.scrolled-middle .twitter-tweet-rendered {
      -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 1) 20%, rgba(0, 0, 0, 1) 80%, rgba(0, 0, 0, 0) 100%);
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 1) 20%, rgba(0, 0, 0, 1) 80%, rgba(0, 0, 0, 0) 100%);
    }

    .carousel-card-item.scrolled-bottom iframe,
    .carousel-card-item.scrolled-bottom .twitter-tweet,
    .carousel-card-item.scrolled-bottom .twitter-tweet-rendered {
      -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 1) 22%, rgba(0, 0, 0, 1) 100%);
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 1) 22%, rgba(0, 0, 0, 1) 100%);
    }

    .carousel-card-item.tilting {
      transition: transform 0.15s ease-out !important;
    }

    .carousel-card-item::-webkit-scrollbar { 
      width: 4px;
    }

    .carousel-card-item::-webkit-scrollbar-track {
      background: transparent;
      margin: 16px 0;
    }

    .carousel-card-item::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      transition: background 0.3s ease;
    }

    .carousel-card-item:hover::-webkit-scrollbar-thumb {
      background: rgba(255, 182, 193, 0.6);
    }

    .carousel-card-item.pos-center {
      transform: translateX(0%) scale(1.05) translateZ(0px);
      opacity: 1;
      filter: none;
      z-index: 10;
      box-shadow: 
        0 25px 50px rgba(219, 39, 119, 0.22),
        0 0 30px rgba(255, 255, 255, 0.6),
        inset 0 2px 4px rgba(255, 255, 255, 1);
      border-color: rgba(255, 255, 255, 0.98);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.68) 0%, rgba(255, 235, 242, 0.4) 100%);
    }

    .side-click-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 50;
      cursor: pointer;
      display: none;
    }

    /* 포지션 상태 (pos-hidden 상태 추가로 N개 트윗 호환성 확장) */
    .carousel-card-item.pos-hidden {
      transform: translateX(0%) scale(0.5) translateZ(-200px);
      opacity: 0;
      filter: blur(5px);
      z-index: 1;
      pointer-events: none;
    }

    .carousel-card-item.pos-left {
      transform: translateX(-92%) scale(0.8) rotateY(12deg);
      opacity: 0.45;
      filter: none;
      z-index: 5;
    }

    .carousel-card-item.pos-left .side-click-overlay {
      display: block;
    }

    .carousel-card-item.pos-right {
      transform: translateX(92%) scale(0.8) rotateY(-12deg);
      opacity: 0.45;
      filter: none;
      z-index: 5;
    }

    .carousel-card-item.pos-right .side-click-overlay {
      display: block;
    }

    @media (min-width: 768px) {
      .carousel-card-item.pos-left {
        transform: translateX(-110%) scale(0.85) rotateY(12deg);
        opacity: 0.65;
      }
      .carousel-card-item.pos-right {
        transform: translateX(110%) scale(0.85) rotateY(-12deg);
        opacity: 0.65;
      }
      .box-outer-container {
        padding: 0 5rem;
      }
      .nav-arrow-btn.left { left: -0.5rem; }
      .nav-arrow-btn.right { right: -0.5rem; }
    }

    /* =========================================
       2페이지 하단 미니 카운트다운 풋터
       ========================================= */
    .mini-sticky-countdown {
      position: fixed;
      bottom: 0.8rem;
      left: 50%;
      transform: translateX(-50%) translateY(120px) scale(0.6);
      opacity: 0;
      pointer-events: none;
      z-index: 90;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      padding: 0.45rem 1.4rem;
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(219, 39, 119, 0.25);
      transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s ease;
      cursor: pointer;
      white-space: nowrap;
    }

    .mini-sticky-countdown.show {
      transform: translateX(-50%) translateY(0) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .mini-timer-text {
      font-family: 'CustomFont', sans-serif;
      font-size: clamp(1rem, 3.5vw, 1.25rem);
      font-weight: bold;
      background: linear-gradient(135deg, #be185d, #9333ea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .mini-day-text {
      font-family: 'CustomFont', sans-serif;
      font-size: clamp(0.9rem, 3vw, 1.05rem);
      color: #db2777;
      font-weight: bold;
      border-left: 1.5px solid rgba(236, 72, 153, 0.3);
      padding-left: 0.6rem;
    }

    /* =========================================
       오른쪽 네비게이션 점 (Dots Indicator)
       ========================================= */
    .dots-nav {
      position: fixed;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      z-index: 100;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.8);
      cursor: pointer;
      transition: all 0.4s ease;
    }

    .dot.active {
      background: #ffffff;
      height: 24px;
      border-radius: 10px;
      box-shadow: 0 0 12px rgba(255, 182, 193, 1), 0 0 25px rgba(219, 39, 119, 0.8);
    }
  </style>
</head>
<body>

  <!-- 동적 패럴랙스 배경 레이어 -->
  <div class="bg-parallax-layer" id="bg-parallax"></div>

  <!-- 우측 상단 핫키 버튼 그룹 -->
  <div class="hotkey-group">
    <a href="https://cafe.naver.com/penyo" target="_blank" class="hotkey-btn" title="히나리 페뇨 공식 네이버 카페">
      <span class="naver-cafe-icon">N</span>
    </a>
    <a href="https://www.youtube.com/@HinariPenyo" target="_blank" class="hotkey-btn" title="히나리 페뇨 공식 유튜브 채널">
      <svg viewBox="0 0 24 24" class="youtube-icon-svg">
        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
      </svg>
    </a>
    <a href="https://x.com/HinariPenyo" target="_blank" class="hotkey-btn" title="히나리 페뇨 공식 X(트위터)">
      <svg viewBox="0 0 24 24">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>
    </a>
  </div>

  <!-- 오른쪽 2개 인디케이터 점 -->
  <div class="dots-nav">
    <div class="dot active" onclick="goToSection(0)" title="카운트다운"></div>
    <div class="dot" onclick="goToSection(1)" title="@HinariPenyo 게시물"></div>
  </div>

  <!-- 2페이지 전용 하단 미니 스티키 카운트다운 -->
  <div class="mini-sticky-countdown" id="mini-countdown" onclick="goToSection(0)" title="카운트다운으로 돌아가기">
    <span style="color: #be185d; font-size: 0.9rem;">⏳</span>
    <span class="mini-timer-text" id="mini-time">00:00:00</span>
    <span class="mini-day-text" id="mini-day">Day-0</span>
  </div>

  <!-- 전체 수직 슬라이딩 트랙 -->
  <div class="slider-track" id="slider-track">
    
    <!-- PAGE 1: 카운트다운 -->
    <section class="section-view" id="sec-0">
      <h1 class="target-title">雛莉ぺにょ(히나리 페뇨)의 첫방송까지</h1>
      <div class="timer-display" id="time-timer">00:00:00</div>
      <div class="day-sub-display" id="day-sub">Day-0</div>

      <div class="page1-bottom-bar" onclick="goToSection(1)" title="@HinariPenyo 게시물로 이동">
        <span class="page1-bottom-bar-text">@HinariPenyo</span>
        <span class="page1-bottom-bar-icon">↓</span>
      </div>
    </section>

    <!-- PAGE 2: 3D 회전목마 -->
    <section class="section-view" id="sec-1">
      <div class="x-section-wrapper">
        <h2 class="x-section-title">@HinariPenyo</h2>
        
        <div class="box-outer-container">
          
          <button class="nav-arrow-btn left" onclick="rotateCarousel('prev')" title="이전 게시글">
            <svg viewBox="0 0 24 24">
              <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
            </svg>
          </button>

          <button class="nav-arrow-btn right" onclick="rotateCarousel('next')" title="다음 게시글">
            <svg viewBox="0 0 24 24">
              <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
            </svg>
          </button>

          <div class="pink-container-box" id="tilt-container">
            <div class="carousel-track">
              <!-- 카드 0: 8월 7일 (D-1 최신 트윗 - 중앙 정중앙배치!) -->
              <div class="carousel-card-item scrolled-top pos-center" id="card-0">
                <div class="side-click-overlay" onclick="handleCardClick(0)"></div>
                <blockquote class="twitter-tweet" data-theme="light" data-chrome="transparent">
                  <a href="https://twitter.com/HinariPenyo/status/2085528853238497438"></a>
                </blockquote>
              </div>

              <!-- 카드 1: 8월 5일 (D-4 트윗 - 오른쪽에 배치) -->
              <div class="carousel-card-item scrolled-top pos-right" id="card-1">
                <div class="side-click-overlay" onclick="handleCardClick(1)"></div>
                <blockquote class="twitter-tweet" data-theme="light" data-chrome="transparent">
                  <a href="https://twitter.com/HinariPenyo/status/2084817538178064536"></a>
                </blockquote>
              </div>

              <!-- 카드 2: 8월 3일 (D-6 트윗 - 대기) -->
              <div class="carousel-card-item scrolled-top pos-hidden" id="card-2">
                <div class="side-click-overlay" onclick="handleCardClick(2)"></div>
                <blockquote class="twitter-tweet" data-theme="light" data-chrome="transparent">
                  <a href="https://twitter.com/HinariPenyo/status/2084095226592067637"></a>
                </blockquote>
              </div>

              <!-- 카드 3: 8월 1일 (D-8 트윗 - 왼쪽에 배치) -->
              <div class="carousel-card-item scrolled-top pos-left" id="card-3">
                <div class="side-click-overlay" onclick="handleCardClick(3)"></div>
                <blockquote class="twitter-tweet" data-theme="light" data-chrome="transparent">
                  <a href="https://twitter.com/HinariPenyo/status/2083387258468725047"></a>
                </blockquote>
              </div>
            </div>
          </div>

        </div>

      </div>
    </section>

  </div>

  <!-- X Embed Script -->
  <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
  
  <script>
    // -------------------------------------------------------------
    // 수직 슬라이딩 & 배경 패럴랙스
    // -------------------------------------------------------------
    let currentSection = 0;
    let isTransitioning = false;

    const sliderTrack = document.getElementById('slider-track');
    const dots = document.querySelectorAll('.dot');
    const miniCountdown = document.getElementById('mini-countdown');
    const bgParallax = document.getElementById('bg-parallax');

    function goToSection(index) {
      if (index < 0 || index > 1 || isTransitioning) return;

      isTransitioning = true;
      currentSection = index;

      sliderTrack.style.transform = `translateY(-${index * 50}%)`;

      if (index === 1) {
        bgParallax.classList.add('bottom-view');
        miniCountdown.classList.add('show');
      } else {
        bgParallax.classList.remove('bottom-view');
        miniCountdown.classList.remove('show');
      }

      dots.forEach((dot, idx) => {
        if (idx === index) {
          dot.classList.add('active');
        } else {
          dot.classList.remove('active');
        }
      });

      setTimeout(() => {
        isTransitioning = false;
      }, 850);
    }

    // -------------------------------------------------------------
    // 3D 회전목마 캐러셀 순환 회전 알고리즘 (최신 8/7일 트윗이 맨 처음 중앙 오도록 배치)
    // -------------------------------------------------------------
    const totalCardsCount = 4;
    // card-0(8/7 최신): pos 1 (중앙)
    // card-1(8/5): pos 2 (오른쪽)
    // card-2(8/3): pos 3 (숨김)
    // card-3(8/1): pos 0 (왼쪽)
    let currentPosMap = [1, 2, 3, 0]; 

    const cards = [
      document.getElementById('card-0'),
      document.getElementById('card-1'),
      document.getElementById('card-2'),
      document.getElementById('card-3')
    ];

    function updateCarouselPositions() {
      cards.forEach((cardEl, idx) => {
        cardEl.style.transform = '';
        cardEl.classList.remove('tilting');
        
        const posVal = currentPosMap[idx];
        let posClass = 'pos-hidden';
        
        if (posVal === 0) posClass = 'pos-left';
        else if (posVal === 1) posClass = 'pos-center';
        else if (posVal === 2) posClass = 'pos-right';
        
        const isTop = cardEl.scrollTop <= 5;
        const isBottom = cardEl.scrollHeight - cardEl.scrollTop <= cardEl.clientHeight + 10;
        
        let scrollStateClass = 'scrolled-middle';
        if (isTop && isBottom) {
          scrollStateClass = '';
        } else if (isTop) {
          scrollStateClass = 'scrolled-top';
        } else if (isBottom) {
          scrollStateClass = 'scrolled-bottom';
        }

        cardEl.className = 'carousel-card-item ' + posClass + ' ' + scrollStateClass;
      });
      checkCardsScrollState();
    }

    function rotateCarousel(direction) {
      if (direction === 'next') {
        currentPosMap = currentPosMap.map(val => (val + totalCardsCount - 1) % totalCardsCount);
      } else {
        currentPosMap = currentPosMap.map(val => (val + 1) % totalCardsCount);
      }
      updateCarouselPositions();
    }

    function handleCardClick(cardIndex) {
      const posVal = currentPosMap[cardIndex];
      if (posVal === 0) {
        rotateCarousel('prev');
      } else if (posVal === 2) {
        rotateCarousel('next');
      }
    }

    // -------------------------------------------------------------
    // 모바일 터치 스와이프 제스처
    // -------------------------------------------------------------
    let touchStartX = 0;
    let touchStartY = 0;

    const tiltContainer = document.getElementById('tilt-container');

    tiltContainer.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    tiltContainer.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;

      const diffX = touchStartX - touchEndX;
      const diffY = touchStartY - touchEndY;

      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 35) {
        if (diffX > 0) {
          rotateCarousel('next');
        } else {
          rotateCarousel('prev');
        }
      }
    }, { passive: true });

    // -------------------------------------------------------------
    // 스크롤 위치별 동적 상하 그라데이션 제어
    // -------------------------------------------------------------
    function checkCardsScrollState() {
      cards.forEach(cardEl => {
        const scrollTop = cardEl.scrollTop;
        const scrollHeight = cardEl.scrollHeight;
        const clientHeight = cardEl.clientHeight;

        const isTop = scrollTop <= 5;
        const isBottom = scrollHeight - scrollTop <= clientHeight + 10;

        cardEl.classList.remove('scrolled-top', 'scrolled-middle', 'scrolled-bottom');

        if (isTop && isBottom) {
          // 스크롤 필요 없음
        } else if (isTop) {
          cardEl.classList.add('scrolled-top');
        } else if (isBottom) {
          cardEl.classList.add('scrolled-bottom');
        } else {
          cardEl.classList.add('scrolled-middle');
        }
      });
    }

    cards.forEach(cardEl => {
      cardEl.addEventListener('scroll', checkCardsScrollState, { passive: true });
    });

    setTimeout(checkCardsScrollState, 1500);

    // -------------------------------------------------------------
    // 마우스 3D 틸트 (데스크톱 전용)
    // -------------------------------------------------------------
    tiltContainer.addEventListener('mousemove', (e) => {
      if (window.innerWidth < 768) return;

      const centerIdx = currentPosMap.indexOf(1);
      if (centerIdx === -1) return;

      const centerCard = cards[centerIdx];
      centerCard.classList.add('tilting');

      const rect = tiltContainer.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const centerX = rect.width / 2;
      const centerY = rect.height / 2;

      const rotateX = ((y - centerY) / centerY) * -6;
      const rotateY = ((x - centerX) / centerX) * 8;

      centerCard.style.transform = `translateX(0%) scale(1.05) translateZ(0px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    tiltContainer.addEventListener('mouseleave', () => {
      const centerIdx = currentPosMap.indexOf(1);
      if (centerIdx !== -1) {
        const centerCard = cards[centerIdx];
        centerCard.classList.add('tilting');
        centerCard.style.transform = `translateX(0%) scale(1.05) translateZ(0px) rotateX(0deg) rotateY(0deg)`;
        
        setTimeout(() => {
          centerCard.classList.remove('tilting');
        }, 450);
      }
    });

    // -------------------------------------------------------------
    // 마우스 휠 및 터치 제스처 (상하 수직 슬라이딩)
    // -------------------------------------------------------------
    window.addEventListener('wheel', (e) => {
      if (e.deltaY > 20) {
        goToSection(1);
      } else if (e.deltaY < -20) {
        goToSection(0);
      }
    }, { passive: true });

    let windowTouchStartY = 0;
    window.addEventListener('touchstart', (e) => {
      windowTouchStartY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      const windowTouchEndY = e.changedTouches[0].clientY;
      const diffY = windowTouchStartY - windowTouchEndY;

      if (diffY > 75 && currentSection === 0) {
        goToSection(1);
      } else if (diffY < -75 && currentSection === 1) {
        goToSection(0);
      }
    }, { passive: true });

    // -------------------------------------------------------------
    // 카운트다운 타이머 로직 (Day-N 기준: 캘린더 '자정 00시' 날짜 차이 기준)
    // -------------------------------------------------------------
    const targetDate = new Date(2026, 7, 8, 20, 0, 0); // 2026년 8월 8일 20시 (목표 방송일)
    
    const timeTimerEl = document.getElementById('time-timer');
    const daySubEl = document.getElementById('day-sub');
    const miniTimeEl = document.getElementById('mini-time');
    const miniDayEl = document.getElementById('mini-day');

    function updateTimer() {
      const now = new Date();

      // 자정 00:00:00 기준 날짜 차이 계산 (8월 8일 - 오늘 날짜)
      const targetMidnight = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
      const nowMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      const msDiff = targetMidnight.getTime() - nowMidnight.getTime();
      const calendarDaysDiff = Math.round(msDiff / (1000 * 60 * 60 * 24));

      // 정확한 남은 시간 (초 단위)
      const exactMsDiff = targetDate.getTime() - now.getTime();

      if (exactMsDiff <= 0) {
        timeTimerEl.textContent = '00:00:00';
        daySubEl.textContent = 'Day-0';
        miniTimeEl.textContent = '00:00:00';
        miniDayEl.textContent = 'Day-0';
        return;
      }

      // 누적 총 시간 (Hours)
      const totalHours = Math.floor(exactMsDiff / (1000 * 60 * 60));
      const minutes = Math.floor((exactMsDiff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((exactMsDiff % (1000 * 60)) / 1000);

      const totalHStr = String(totalHours).padStart(2, '0');
      const mStr = String(minutes).padStart(2, '0');
      const sStr = String(seconds).padStart(2, '0');

      const timeFormatted = `${totalHStr}:${mStr}:${sStr}`;
      
      const dayFormatted = `Day-${calendarDaysDiff}`;

      timeTimerEl.textContent = timeFormatted;
      daySubEl.textContent = dayFormatted;

      miniTimeEl.textContent = timeFormatted;
      miniDayEl.textContent = dayFormatted;
    }

    setInterval(updateTimer, 1000);
    updateTimer();
  </script>
</body>
</html>
