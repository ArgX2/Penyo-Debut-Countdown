<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penyo Debut Countdown</title>
  
  <style>
    /* 사용자 커스텀 폰트 적용 (font.ttf) */
    @font-face {
      font-family: 'CustomFont';
      src: url('font.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden; /* 스크롤 차단 */
      font-family: 'CustomFont', sans-serif;
    }

    /* 동적 패럴랙스 배경 트랙 (위 ➔ 아래 스크롤 애니메이션) */
    .bg-parallax-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: url('Bg.png');
      background-size: cover;
      background-position: top center;
      background-repeat: no-repeat;
      background-color: #fff5f8;
      transition: background-position 0.9s cubic-bezier(0.65, 0, 0.35, 1);
      z-index: 0;
    }

    .bg-parallax-layer.bottom-view {
      background-position: bottom center;
    }

    /* 전체 수직 슬라이딩 트랙 컨테이너 */
    .slider-track {
      width: 100vw;
      height: 200vh;
      position: absolute;
      top: 0;
      left: 0;
      transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1);
      transform: translateY(0%);
      z-index: 1;
    }

    /* 각 섹션 뷰 (100vh) */
    .section-view {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* =========================================
       우측 상단 핫키 버튼 그룹
       ========================================= */
    .hotkey-group {
      position: fixed;
      top: 1.8rem;
      right: 2rem;
      z-index: 110;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .hotkey-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 8px 20px rgba(219, 39, 119, 0.2);
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s;
    }

    .hotkey-btn:hover {
      transform: scale(1.12);
      background: rgba(255, 255, 255, 0.95);
    }

    .hotkey-btn svg {
      width: 20px;
      height: 20px;
      fill: #be185d;
    }

    .naver-cafe-icon {
      font-family: sans-serif;
      font-weight: 900;
      font-size: 1.25rem;
      color: #03c75a;
    }

    .youtube-icon-svg {
      fill: #ff0000 !important;
    }

    /* =========================================
       PAGE 1: 카운트다운 메인 뷰
       ========================================= */
    .target-title {
      font-family: 'CustomFont', sans-serif;
      font-size: clamp(1.6rem, 3.8vw, 2.8rem);
      font-weight: normal;
      color: #ffffff;
      text-shadow: 
        0 0 15px rgba(255, 255, 255, 1),
        0 0 30px rgba(255, 182, 193, 1),
        0 0 50px rgba(219, 39, 119, 0.95),
        0 0 80px rgba(147, 51, 234, 0.8),
        0 4px 10px rgba(0, 0, 0, 0.6);
      margin-bottom: 0;
      padding-bottom: 2.8rem;
      text-align: center;
      letter-spacing: 4px;
    }

    .timer-display {
      font-family: 'CustomFont', sans-serif;
      font-size: clamp(4.5rem, 16vw, 12.5rem);
      font-weight: bold;
      color: #ffffff;
      text-shadow: 
        0 0 30px rgba(255, 182, 193, 1),
        0 0 60px rgba(219, 39, 119, 0.95),
        0 0 100px rgba(147, 51, 234, 0.8),
        0 8px 20px rgba(0, 0, 0, 0.5);
      line-height: 1;
      text-align: center;
      letter-spacing: 12px;
      margin-bottom: 1.5rem;
      padding: 0 1rem;
    }

    .day-sub-display {
      font-family: 'CustomFont', sans-serif;
      font-size: clamp(1.5rem, 3.2vw, 2.4rem);
      color: #ffffff;
      text-shadow: 
        0 0 15px rgba(255, 255, 255, 1),
        0 0 30px rgba(255, 182, 193, 1),
        0 0 50px rgba(219, 39, 119, 0.95),
        0 0 80px rgba(147, 51, 234, 0.8),
        0 4px 10px rgba(0, 0, 0, 0.6);
      text-align: center;
      letter-spacing: 5px;
    }

    /* =========================================
       PAGE 2: 회전목마(3D Carousel) 뷰
       ========================================= */
    .x-section-wrapper {
      width: 100%;
      max-width: 1550px;
      height: 88vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.5rem 1rem 0 1rem;
    }

    .x-section-title {
      font-family: 'CustomFont', sans-serif;
      font-size: clamp(1.4rem, 3vw, 2rem);
      color: #ffffff;
      text-shadow: 0 0 15px rgba(255, 105, 180, 0.8);
      margin-bottom: 0.8rem;
      text-align: center;
    }

    .box-outer-container {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      position: relative;
      padding: 0 5rem;
    }

    .nav-arrow-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 1)) drop-shadow(0 0 25px rgba(244, 114, 182, 0.9));
      transition: all 0.3s ease;
      padding: 0.5rem;
    }

    .nav-arrow-btn.left { left: -0.5rem; }
    .nav-arrow-btn.right { right: -0.5rem; }

    .nav-arrow-btn svg {
      width: 68px;
      height: 68px;
      fill: #ffffff;
    }

    .nav-arrow-btn:hover {
      transform: translateY(-50%) scale(1.2);
      filter: drop-shadow(0 0 20px rgba(255, 255, 255, 1)) drop-shadow(0 0 35px rgba(236, 72, 153, 1));
    }

    .pink-container-box {
      width: 100%;
      height: 100%;
      background: rgba(255, 182, 193, 0.35);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 40px;
      padding: 1.5rem;
      box-shadow: 0 25px 50px rgba(219, 39, 119, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .carousel-track {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
    }

    .carousel-card-item {
      position: absolute;
      width: 32%;
      max-width: 380px;
      height: 92%;
      aspect-ratio: 3 / 5;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.45);
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      padding: 0.6rem;
      overflow-y: auto;
      overflow-x: hidden;
      
      -webkit-font-smoothing: antialiased;
      backface-visibility: hidden;
      transform-style: preserve-3d;
      will-change: transform, opacity;
      
      transition: 
        transform 0.6s cubic-bezier(0.25, 1, 0.5, 1),
        opacity 0.6s ease,
        filter 0.6s ease,
        z-index 0.6s;
    }

    .carousel-card-item.tilting {
      transition: transform 0.45s cubic-bezier(0.1, 0.8, 0.3, 1) !important;
    }

    .carousel-card-item::-webkit-scrollbar { width: 4px; }
    .carousel-card-item::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.5);
      border-radius: 2px;
    }

    .carousel-card-item.pos-center {
      transform: translateX(0%) scale(1.04) translateZ(0px);
      opacity: 1;
      filter: none;
      z-index: 10;
      box-shadow: 0 15px 35px rgba(219, 39, 119, 0.25);
      border-color: rgba(255, 255, 255, 0.95);
    }

    .carousel-card-item.pos-left {
      transform: translateX(-105%) scale(0.85) rotateY(10deg);
      opacity: 0.65;
      filter: none;
      z-index: 5;
      pointer-events: none;
    }

    .carousel-card-item.pos-right {
      transform: translateX(105%) scale(0.85) rotateY(-10deg);
      opacity: 0.65;
      filter: none;
      z-index: 5;
      pointer-events: none;
    }

    /* =========================================
       2페이지 하단 미니 카운트다운 풋터
       ========================================= */
    .mini-sticky-countdown {
      position: fixed;
      bottom: 0.8rem;
      left: 50%;
      transform: translateX(-50%) translateY(120px) scale(0.6);
      opacity: 0;
      pointer-events: none;
      z-index: 90;
      display: flex;
      align-items: center;
      gap: 1rem;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      padding: 0.5rem 1.8rem;
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(219, 39, 119, 0.25);
      transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s ease;
      cursor: pointer;
    }

    .mini-sticky-countdown.show {
      transform: translateX(-50%) translateY(0) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .mini-timer-text {
      font-family: 'CustomFont', sans-serif;
      font-size: 1.25rem;
      font-weight: bold;
      background: linear-gradient(135deg, #be185d, #9333ea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .mini-day-text {
      font-family: 'CustomFont', sans-serif;
      font-size: 1.05rem;
      color: #db2777;
      font-weight: bold;
      border-left: 1.5px solid rgba(236, 72, 153, 0.3);
      padding-left: 0.8rem;
    }

    /* =========================================
       오른쪽 네비게이션 점 (Dots Indicator)
       ========================================= */
    .dots-nav {
      position: fixed;
      right: 2rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      z-index: 100;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.8);
      cursor: pointer;
      transition: all 0.4s ease;
    }

    .dot.active {
      background: #ffffff;
      height: 28px;
      border-radius: 10px;
      box-shadow: 0 0 12px rgba(255, 182, 193, 1), 0 0 25px rgba(219, 39, 119, 0.8);
    }
  </style>
</head>
<body>

  <!-- 동적 배경 레이어 -->
  <div class="bg-parallax-layer" id="bg-parallax"></div>

  <!-- 우측 상단 핫키 버튼 그룹 -->
  <div class="hotkey-group">
    <a href="https://cafe.naver.com/penyo" target="_blank" class="hotkey-btn" title="히나리 페뇨 공식 네이버 카페">
      <span class="naver-cafe-icon">N</span>
    </a>
    <a href="https://www.youtube.com/@HinariPenyo" target="_blank" class="hotkey-btn" title="히나리 페뇨 공식 유튜브 채널">
      <svg viewBox="0 0 24 24" class="youtube-icon-svg">
        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
      </svg>
    </a>
    <a href="https://x.com/HinariPenyo" target="_blank" class="hotkey-btn" title="히나리 페뇨 공식 X(트위터)">
      <svg viewBox="0 0 24 24">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>
    </a>
  </div>

  <!-- 오른쪽 2개 인디케이터 점 -->
  <div class="dots-nav">
    <div class="dot active" onclick="goToSection(0)" title="카운트다운"></div>
    <div class="dot" onclick="goToSection(1)" title="@HinariPenyo 게시물"></div>
  </div>

  <!-- 2페이지 전용 하단 미니 스티키 카운트다운 -->
  <div class="mini-sticky-countdown" id="mini-countdown" onclick="goToSection(0)" title="카운트다운으로 돌아가기">
    <span style="color: #be185d; font-size: 0.9rem;">⏳</span>
    <span class="mini-timer-text" id="mini-time">00:00:00</span>
    <span class="mini-day-text" id="mini-day">Day-0</span>
  </div>

  <!-- 전체 수직 슬라이딩 트랙 -->
  <div class="slider-track" id="slider-track">
    
    <!-- PAGE 1: 카운트다운 -->
    <section class="section-view" id="sec-0">
      <h1 class="target-title">雛莉ぺにょ(히나리 페뇨)의 첫방송까지</h1>
      <div class="timer-display" id="time-timer">00:00:00</div>
      <div class="day-sub-display" id="day-sub">Day-0</div>
    </section>

    <!-- PAGE 2: 3D 회전목마 -->
    <section class="section-view" id="sec-1">
      <div class="x-section-wrapper">
        <h2 class="x-section-title">@HinariPenyo</h2>
        
        <div class="box-outer-container">
          
          <button class="nav-arrow-btn left" onclick="rotateCarousel('prev')" title="이전 게시글">
            <svg viewBox="0 0 24 24">
              <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
            </svg>
          </button>

          <button class="nav-arrow-btn right" onclick="rotateCarousel('next')" title="다음 게시글">
            <svg viewBox="0 0 24 24">
              <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
            </svg>
          </button>

          <div class="pink-container-box" id="tilt-container">
            <div class="carousel-track">
              <!-- 카드 1 -->
              <div class="carousel-card-item pos-left" id="card-0">
                <blockquote class="twitter-tweet" data-theme="light" data-chrome="transparent">
                  <a href="https://twitter.com/HinariPenyo/status/2083387258468725047"></a>
                </blockquote>
              </div>

              <!-- 카드 2 -->
              <div class="carousel-card-item pos-center" id="card-1">
                <blockquote class="twitter-tweet" data-theme="light" data-chrome="transparent">
                  <a href="https://twitter.com/HinariPenyo/status/2084095226592067637"></a>
                </blockquote>
              </div>

              <!-- 카드 3 -->
              <div class="carousel-card-item pos-right" id="card-2">
                <blockquote class="twitter-tweet" data-theme="light" data-chrome="transparent">
                  <a href="https://twitter.com/HinariPenyo/status/2084817538178064536"></a>
                </blockquote>
              </div>
            </div>
          </div>

        </div>

      </div>
    </section>

  </div>

  <!-- X Embed Script -->
  <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
  
  <script>
    // -------------------------------------------------------------
    // 수직 슬라이딩 & 배경 패럴랙스
    // -------------------------------------------------------------
    let currentSection = 0;
    let isTransitioning = false;

    const sliderTrack = document.getElementById('slider-track');
    const dots = document.querySelectorAll('.dot');
    const miniCountdown = document.getElementById('mini-countdown');
    const bgParallax = document.getElementById('bg-parallax');

    function goToSection(index) {
      if (index < 0 || index > 1 || isTransitioning) return;

      isTransitioning = true;
      currentSection = index;

      sliderTrack.style.transform = `translateY(-${index * 50}%)`;

      if (index === 1) {
        bgParallax.classList.add('bottom-view');
        miniCountdown.classList.add('show');
      } else {
        bgParallax.classList.remove('bottom-view');
        miniCountdown.classList.remove('show');
      }

      dots.forEach((dot, idx) => {
        if (idx === index) {
          dot.classList.add('active');
        } else {
          dot.classList.remove('active');
        }
      });

      setTimeout(() => {
        isTransitioning = false;
      }, 850);
    }

    // -------------------------------------------------------------
    // 3D 회전목마 캐러셀 순환 회전 알고리즘
    // -------------------------------------------------------------
    let currentPosMap = [0, 1, 2];
    const cards = [
      document.getElementById('card-0'),
      document.getElementById('card-1'),
      document.getElementById('card-2')
    ];

    const positionClasses = ['pos-left', 'pos-center', 'pos-right'];

    function updateCarouselPositions() {
      cards.forEach((cardEl, idx) => {
        cardEl.style.transform = '';
        cardEl.classList.remove('tilting');
        
        const posIndex = currentPosMap[idx];
        cardEl.className = 'carousel-card-item ' + positionClasses[posIndex];
      });
    }

    function rotateCarousel(direction) {
      if (direction === 'next') {
        currentPosMap = currentPosMap.map(pos => (pos + 2) % 3);
      } else {
        currentPosMap = currentPosMap.map(pos => (pos + 1) % 3);
      }
      updateCarouselPositions();
    }

    // -------------------------------------------------------------
    // 부드러운 스무스 마우스 틸트
    // -------------------------------------------------------------
    const tiltContainer = document.getElementById('tilt-container');

    tiltContainer.addEventListener('mousemove', (e) => {
      const centerIdx = currentPosMap.indexOf(1);
      if (centerIdx === -1) return;

      const centerCard = cards[centerIdx];
      centerCard.classList.add('tilting');

      const rect = tiltContainer.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const centerX = rect.width / 2;
      const centerY = rect.height / 2;

      const rotateX = ((y - centerY) / centerY) * -8;
      const rotateY = ((x - centerX) / centerX) * 8;

      centerCard.style.transform = `translateX(0%) scale(1.04) translateZ(10px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    tiltContainer.addEventListener('mouseleave', () => {
      const centerIdx = currentPosMap.indexOf(1);
      if (centerIdx !== -1) {
        const centerCard = cards[centerIdx];
        centerCard.classList.add('tilting');
        centerCard.style.transform = `translateX(0%) scale(1.04) translateZ(0px) rotateX(0deg) rotateY(0deg)`;
        
        setTimeout(() => {
          centerCard.classList.remove('tilting');
        }, 450);
      }
    });

    // -------------------------------------------------------------
    // 마우스 휠 및 터치 제스처
    // -------------------------------------------------------------
    window.addEventListener('wheel', (e) => {
      if (e.deltaY > 20) {
        goToSection(1);
      } else if (e.deltaY < -20) {
        goToSection(0);
      }
    }, { passive: true });

    let touchStartY = 0;
    window.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      const touchEndY = e.changedTouches[0].clientY;
      const diffY = touchStartY - touchEndY;

      if (diffY > 50) {
        goToSection(1);
      } else if (diffY < -50) {
        goToSection(0);
      }
    }, { passive: true });

    // -------------------------------------------------------------
    // 카운트다운 타이머 로직
    // -------------------------------------------------------------
    const targetDate = new Date(2026, 7, 8, 20, 0, 0); // 8월 8일 20시
    
    const timeTimerEl = document.getElementById('time-timer');
    const daySubEl = document.getElementById('day-sub');
    const miniTimeEl = document.getElementById('mini-time');
    const miniDayEl = document.getElementById('mini-day');

    function updateTimer() {
      const currentTime = new Date().getTime();
      const difference = targetDate.getTime() - currentTime;

      if (difference <= 0) {
        timeTimerEl.textContent = '00:00:00';
        daySubEl.textContent = 'Day-0';
        miniTimeEl.textContent = '00:00:00';
        miniDayEl.textContent = 'Day-0';
        return;
      }

      const rawDays = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      const totalHours = (rawDays * 24) + hours;

      const totalHStr = String(totalHours).padStart(2, '0');
      const mStr = String(minutes).padStart(2, '0');
      const sStr = String(seconds).padStart(2, '0');

      const timeFormatted = `${totalHStr}:${mStr}:${sStr}`;
      const dayFormatted = `Day-${rawDays}`;

      timeTimerEl.textContent = timeFormatted;
      daySubEl.textContent = dayFormatted;

      miniTimeEl.textContent = timeFormatted;
      miniDayEl.textContent = dayFormatted;
    }

    setInterval(updateTimer, 1000);
    updateTimer();
  </script>
</body>
</html>
